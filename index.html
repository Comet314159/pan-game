<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>まじデカすぎてパン</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;height:100dvh;-webkit-touch-callout:none;background:#2b1a10;color:#fff;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden;touch-action:none}
#app{position:relative;max-width:480px;height:100%;height:100dvh;touch-action:none;margin:0 auto;background:var(--bg,linear-gradient(#ffd9a0,#f6a85a 55%,#8a4a22));color:var(--fg,#4a2610);overflow:hidden}
#app::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none;
 background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 10%,#fff,transparent),radial-gradient(1px 1px at 30% 55%,#fff,transparent)}
#app[data-band="4"]::before,#app[data-band="5"]::before{opacity:1}
#app.shake{animation:shake .25s}
#app.shake2{animation:shake2 .45s}
@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}
@keyframes shake2{10%{transform:translate(-14px,8px)}25%{transform:translate(12px,-8px)}40%{transform:translate(-10px,6px)}55%{transform:translate(8px,-5px)}70%{transform:translate(-5px,3px)}85%{transform:translate(3px,-2px)}}
.hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;font-weight:700;color:var(--fg,#4a2610);text-shadow:0 1px 0 #fff4}
.hud small{display:block;font-size:11px;opacity:.75;font-weight:600}
.hud b{font-size:22px}
#pause{width:38px;height:38px;border-radius:50%;border:2px solid var(--fg,#4a2610);background:#fff5;color:var(--fg,#4a2610);font-size:15px;font-weight:900;cursor:pointer;margin-top:2px;padding:0}
#timebar{position:absolute;top:58px;left:12px;right:12px;height:8px;background:#0003;border-radius:4px;overflow:hidden}
#timefill{height:100%;width:100%;background:#fff;transition:width .1s linear}
#earth{position:absolute;top:70px;left:0;right:0;text-align:center;font-weight:800;color:var(--fg,#4a2610);font-size:14px}
#cmp{position:absolute;top:90px;left:0;right:0;text-align:center;font-weight:700;color:var(--fg,#4a2610);font-size:12px;opacity:.9}
#stage{position:absolute;top:112px;bottom:170px;left:0;right:0;display:flex;align-items:center;justify-content:center;perspective:700px}
#bread{line-height:1;transition:transform .12s ease-out;will-change:transform,filter}
#bread.pop{animation:pop .3s}
#bread.flip{animation:flipY .4s}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes flipY{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-40px)}100%{transform:rotateY(360deg) translateY(0)}}
#size{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:800;color:var(--fg,#4a2610);text-shadow:0 1px 0 #fff4;font-size:15px}
#result{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;pointer-events:none;opacity:0;text-shadow:0 3px 0 #0006,0 0 12px #000a}
#result.show{animation:res .9s}
@keyframes res{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#gaugewrap{position:absolute;left:20px;right:20px;bottom:56px;height:46px}
#gauge.inzone{box-shadow:0 0 18px 6px #ffe066;border-color:#ffe066}
#gauge{transition:box-shadow .1s;position:relative;height:100%;background:#3b1d0acc;border-radius:23px;overflow:hidden;border:3px solid #fff}
#zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffe066,#ffe066 8px,#ffc800 8px,#ffc800 16px);opacity:.95}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff9a3c,#e8421c)}
#pips{position:absolute;left:0;right:0;top:-26px;text-align:center;font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000c}
#gtext{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000a}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;opacity:.9;color:#fff;text-shadow:0 1px 2px #000a}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
#rumble{position:absolute;top:46%;font-size:52px;font-weight:900;letter-spacing:4px;color:#fff;-webkit-text-stroke:2px #5a1d00;pointer-events:none;opacity:0;z-index:2}
#rumble.go{animation:rumble .8s}
@keyframes rumble{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.3) rotate(-4deg)}30%{transform:scale(1.1) rotate(3deg)}45%{transform:scale(1.2) rotate(-3deg)}100%{opacity:0;transform:scale(1.4) translateY(-20px)}}
#mile{position:absolute;top:20%;left:0;right:0;text-align:center;font-size:24px;line-height:1.4;white-space:pre-line;font-weight:900;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 3px 0 #0008;pointer-events:none;opacity:0;z-index:2}
#mile.go{animation:mile 1.8s}
@keyframes mile{0%{opacity:0;transform:translateY(20px) scale(.7)}12%{opacity:1;transform:scale(1.1)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-20px)}}
.pt{position:absolute;font-size:24px;pointer-events:none;z-index:2;animation:pt .85s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.screen{position:absolute;inset:0;background:#2b1a10e6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px;z-index:5}
.screen.hide{display:none}
h1{margin:0;font-size:30px;line-height:1.3}
.big{font-size:60px}
.btn{border:0;border-radius:28px;padding:14px 28px;font-size:18px;font-weight:800;background:#ffcf4a;color:#4a2610;cursor:pointer}
.btn.sub{background:#fff3;color:#fff;font-size:14px;padding:10px 18px;font-weight:600}
.stats{background:#fff1;border-radius:14px;padding:12px 18px;line-height:1.9;font-size:15px;min-width:260px;text-align:left}
.stats span{float:right;font-weight:800;margin-left:16px}
.cardbtn{width:100%;max-width:340px;text-align:left;border:0;border-radius:16px;padding:12px 16px;background:#fff;color:#4a2610;font-size:16px;font-weight:800;cursor:pointer;display:flex;gap:14px;align-items:center}
.cardbtn .ce{font-size:30px}
.cardbtn small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}
p{margin:0;line-height:1.6;font-size:14px;opacity:.92}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div><small>焼いた数</small><b id="cnt">0</b></div>
    <div style="text-align:center"><small>連続会心</small><b id="chain">0</b></div>
    <div style="display:flex;gap:10px;align-items:flex-start"><div style="text-align:right"><small>残り</small><b id="time">90</b></div><button id="pause" aria-label="一時停止">⏸</button></div>
  </div>
  <div id="timebar"><div id="timefill"></div></div>
  <div id="earth"></div>
  <div id="cmp"></div>
  <div id="stage"><div id="bread">🍞</div></div>
  <div id="size"></div>
  <div id="result"></div>
  <div id="mile"></div>
  <div id="rumble">ゴゴゴ</div>
  <div id="flash"></div>
  <div id="gaugewrap">
    <div id="pips"></div>
    <div id="gauge"><div id="zone"></div><div id="fill"></div></div>
    <div id="gtext"></div>
  </div>
  <div id="hint">長押しで加熱 → 離して裏返す → もう一度長押しで取り出す</div>

  <div class="screen" id="title">
    <div class="big">🍞🔥</div>
    <h1>まじデカすぎてパン</h1>
    <p>表と裏を両方ちょうどよく焼くほど、次のパンがデカくなる。<br>制限時間内に、パンを地球サイズまで育てろ。</p>
    <p>長押しで表を焼く → 離して裏返す → もう一度長押しで裏を焼く<br>黄色いゾーンで離すと会心。</p>
    <p>サイズが大きくなるとパンの種類が変わり、強化カードも選べる。</p>
    <button class="btn" id="start">タップでスタート</button>
    <div id="bestline" style="font-size:13px;opacity:.8"></div>
    <button class="btn sub bgmbtn">BGM：オン</button>
    <button class="btn sub" id="reset">記録をリセット</button>
  </div>

  <div class="screen hide" id="cardscr">
    <h1>強化カードを選べ</h1>
    <p>1 枚だけ選べます</p>
    <div id="cardlist" style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center"></div>
  </div>

  <div class="screen hide" id="pausescr">
    <div class="big">⏸</div>
    <h1>一時停止</h1>
    <button class="btn" id="resume">再開</button>
    <button class="btn sub" id="restart">最初からやり直す</button>
    <button class="btn sub" id="totitle">タイトルへ戻る</button>
    <button class="btn sub bgmbtn">BGM：オン</button>
  </div>

  <div class="screen hide" id="over">
    <div class="big" id="overIcon">⏰</div>
    <h1 id="overTitle">TIME UP!</h1>
    <div class="stats" id="overStats"></div>
    <button class="btn" id="share">結果をシェア</button>
    <button class="btn" id="retry">もう一回焼く</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const EARTH=12742000;          // 地球の直径[m]
const START=0.2;               // 最初のパン[m]
const TIME=90;                 // 制限時間[s]
const BASE_SPEED=90;           // 加熱速度[ゲージ/s]
const MULT=[1.05,1.15,1.5,2.0,3.0]; // 両面の合計点(0〜4)ごとの成長倍率

const app=$('app'),bread=$('bread');
// サイズの目安 [メートル, 名前]
const REFS=[[0.2,'ふつうのパン'],[0.5,'スイカ'],[1.7,'人間'],[5,'ゾウ'],[12,'バス'],[50,'ビル'],[333,'東京タワー'],[828,'ブルジュ・ハリファ'],[3776,'富士山'],[8849,'エベレスト'],[100000,'宇宙の入口'],[3474000,'月'],[EARTH,'地球']];
// 背景の段階 [この大きさ未満, 背景, 文字色]
const BANDS=[[1.7,'linear-gradient(#ffd9a0,#f6a85a 55%,#8a4a22)','#4a2610'],[333,'linear-gradient(#bfe6ff,#e6f6ff 60%,#9fd18b)','#23405a'],[8849,'linear-gradient(#4f9fe8,#cfe9ff)','#12304d'],[100000,'linear-gradient(#0b1d4d,#2f63b8)','#ffffff'],[3474000,'linear-gradient(#02030a,#0a0a2a)','#ffffff'],[Infinity,'linear-gradient(#0a0220,#3a0f5c)','#ffe9ff']];
// パンの種類（背景の段階と対応）w:ゾーン幅 sp:加熱速度の倍率 amp:ゾーンの揺れ幅 hz:揺れの速さ
const STAGES=[
 {n:'食パン',e:'🍞',w:14,sp:1.00,amp:0,hz:0},
 {n:'バゲット',e:'🥖',w:13,sp:1.08,amp:0,hz:0},
 {n:'クロワッサン',e:'🥐',w:12,sp:1.12,amp:4,hz:.45},
 {n:'プレッツェル',e:'🥨',w:11,sp:1.16,amp:7,hz:.55},
 {n:'ベーグル',e:'🥯',w:10,sp:1.20,amp:9,hz:.65},
 {n:'宇宙パンケーキ',e:'🥞',w:10,sp:1.25,amp:11,hz:.75}
];
// 強化カード
const CARDS=[
 {id:'zone',e:'🔥',t:'ゾーン拡大',d:'黄色いゾーンが少し広くなる',max:4},
 {id:'time',e:'⏱',t:'時間 +10秒',d:'残り時間が今すぐ増える',max:5},
 {id:'crit',e:'💥',t:'会心の威力',d:'ほぼ完璧以上の成長が ×1.15',max:5},
 {id:'slow',e:'🐢',t:'ゆっくり加熱',d:'ゲージの上がり方が遅くなる',max:3},
 {id:'forgive',e:'🍀',t:'焼きムラ許容',d:'生焼け・焦げも「いい焼き色」と同じ点になる',max:1},
 {id:'butter',e:'🧈',t:'バター',d:'2連続会心からボーナス（通常は3連続）',max:1}
];
const CARD_AT=[2,4,6,8,10]; // このサイズの目安に着いたらカードを選ぶ
const newCards=()=>({zone:0,time:0,crit:0,slow:0,forgive:0,butter:0});

const refIdx=m=>{let k=0;for(let i=0;i<REFS.length;i++)if(m>=REFS[i][0])k=i;return k;};
const bandOf=m=>Math.max(0,BANDS.findIndex(b=>m<b[0]));

let state='title',size=START,count=0,chain=0,maxChain=0,perfects=0,left=TIME,heat=0,holding=false,locked=false,lastT=0;
let zoneBase=70,zoneL=70,zoneW=14,stg=STAGES[0],band=-1,raf=0;
let side=0,pts=0,sideKinds=[],cardPending=false,cards=newCards();
let rec=JSON.parse(localStorage.getItem('panRec')||'{"best":0,"clear":0,"fast":0}');

function fmt(m){
  if(m<1) return (m*100).toFixed(m<0.1?1:0)+' cm';
  if(m<1000) return m.toFixed(m<10?2:0)+' m';
  if(m<1e6) return (m/1000).toFixed(m<1e4?2:1)+' km';
  return (m/1000).toLocaleString('ja-JP',{maximumFractionDigits:0})+' km';
}
function remain(){const r=EARTH/size;return r<1.005?'地球サイズ達成！':'地球まであと ×'+(r>=100?Math.round(r).toLocaleString('ja-JP'):r.toFixed(1));}

// ---- sound ----
let ac=null;
function ensureAC(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac;}
function beep(f,d,type='square',v=.07,slide=0){
  try{
    if(!ensureAC())return;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;if(slide)o.frequency.linearRampToValueAtTime(f+slide,ac.currentTime+d);
    g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

// ---- BGM（外部ファイルなし。ブラウザ内で合成） ----
let bgmOn=localStorage.getItem('panBgm')!=='0',bgmTimer=null,bgmStep=0,bgmNext=0;
const MEL=[523,0,659,0,784,659,523,0, 440,0,523,0,659,523,440,0, 349,0,440,0,523,440,349,0, 392,0,494,0,587,494,392,0];
const BASS=[131,110,87,98];
const STEP=0.15;
function tone(f,t,d,type,v){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
}
function bgmSchedule(){
  if(!ac)return;
  while(bgmNext<ac.currentTime+.35){
    const i=bgmStep%32,m=MEL[i];
    if(m)tone(m,bgmNext,STEP*1.6,'triangle',.05);
    if(i%4===0)tone(BASS[Math.floor(i/8)],bgmNext,STEP*3,'sine',.07);
    if(i%2===1)tone(1800,bgmNext,.03,'square',.006);
    bgmNext+=STEP;bgmStep++;
  }
}
function startBgm(){
  if(!bgmOn||bgmTimer)return;
  if(!ensureAC())return;
  bgmNext=ac.currentTime+.05;bgmTimer=setInterval(bgmSchedule,100);
}
function stopBgm(){clearInterval(bgmTimer);bgmTimer=null;}
function bgmLabel(){document.querySelectorAll('.bgmbtn').forEach(b=>b.textContent='BGM：'+(bgmOn?'オン':'オフ'));}
function toggleBgm(){
  bgmOn=!bgmOn;localStorage.setItem('panBgm',bgmOn?'1':'0');bgmLabel();
  if(!bgmOn)stopBgm();else if(state==='play')startBgm();
}

// ---- view ----
function setZone(){
  stg=STAGES[bandOf(size)];
  zoneW=stg.w+cards.zone*3;
  const lo=58+stg.amp,hi=97-zoneW-stg.amp;
  zoneBase=lo+Math.random()*Math.max(0,hi-lo);
  updateZone();
}
function updateZone(){
  zoneL=zoneBase+(stg.amp?stg.amp*Math.sin(performance.now()/1000*stg.hz*Math.PI*2):0);
  zoneL=Math.min(zoneL,97-zoneW);
  const z=$('zone');z.style.left=zoneL+'%';z.style.width=zoneW+'%';
}
const SYM={perfect:'◎',good:'○',raw:'△',burnt:'×'};
function setPips(){
  $('pips').textContent=`表 ${sideKinds[0]?SYM[sideKinds[0]]:'－'}　　裏 ${sideKinds[1]?SYM[sideKinds[1]]:'－'}`;
  $('gtext').textContent=side===0?'① 表面：黄色いゾーンで離して裏返す':'② 裏面：黄色いゾーンで離して取り出す';
}
function render(){
  const bi=bandOf(size);
  if(bi!==band){band=bi;app.dataset.band=bi;app.style.setProperty('--bg',BANDS[bi][1]);app.style.setProperty('--fg',BANDS[bi][2]);bread.textContent=STAGES[bi].e;}
  const ri=refIdx(size),nx=REFS[Math.min(ri+1,REFS.length-1)];
  $('cmp').textContent=`いま：${REFS[ri][1]}級`+(ri<REFS.length-1?` ／ 次の目安：${nx[1]}（あと ×${(nx[0]/size).toFixed(nx[0]/size<10?1:0)}）`:'');
  $('cnt').textContent=count;$('chain').textContent=chain;$('time').textContent=Math.ceil(left);
  $('timefill').style.width=Math.min(100,left/TIME*100)+'%';
  $('earth').textContent=remain();
  $('size').textContent=`${STAGES[bi].n}：${fmt(size)}`;
  const p=Math.log(size/START)/Math.log(EARTH/START);
  const px=70+Math.min(1,Math.max(0,p))*260;
  bread.style.fontSize=px+'px';
}
function tint(v){ // 加熱度でパンの色を変える
  const t=Math.min(1,v/100);
  bread.style.filter=`sepia(${t*.9}) saturate(${1+t*1.5}) brightness(${1.15-t*.75})`;
}
function burst(n,list){
  const a=app.getBoundingClientRect(),b=bread.getBoundingClientRect();
  const cx=b.left+b.width/2-a.left,cy=b.top+b.height/2-a.top;
  for(let i=0;i<n;i++){
    const e=document.createElement('span');e.className='pt';e.textContent=list[i%list.length];
    const ang=Math.random()*Math.PI*2,d=80+Math.random()*140;
    e.style.left=cx+'px';e.style.top=cy+'px';
    e.style.setProperty('--dx',Math.cos(ang)*d+'px');e.style.setProperty('--dy',Math.sin(ang)*d+'px');e.style.setProperty('--r',(Math.random()*540-270)+'deg');
    app.appendChild(e);setTimeout(()=>e.remove(),900);
  }
}
function fx(id){const e=$(id);e.classList.remove('go');void e.offsetWidth;e.classList.add('go');}
function say(text,color){
  const r=$('result');r.textContent=text;r.style.color=color;
  r.classList.remove('show');void r.offsetWidth;r.classList.add('show');
}
function resetBake(){side=0;pts=0;sideKinds=[];setPips();}
function resetGauge(){heat=0;$('fill').style.width='0';$('gauge').classList.remove('inzone');bread.style.translate='';tint(0);}

// ---- game ----
function startGame(){
  size=START;count=0;chain=0;maxChain=0;perfects=0;left=TIME;holding=false;locked=false;cardPending=false;cards=newCards();
  state='play';
  ['title','over','pausescr','cardscr'].forEach(id=>$(id).classList.add('hide'));
  band=-1;resetGauge();resetBake();setZone();render();lastT=performance.now();
  cancelAnimationFrame(raf);startBgm();
  raf=requestAnimationFrame(loop);
}
function loop(t){
  if(state!=='play')return;
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  left-=dt;
  updateZone();
  if(holding&&!locked){
    heat+=BASE_SPEED*stg.sp*Math.pow(.85,cards.slow)*dt;
    if(heat>=100){heat=100;release();}
  }
  $('fill').style.width=heat+'%';
  tint(heat);
  $('gauge').classList.toggle('inzone',holding&&heat>=zoneL&&heat<=zoneL+zoneW);
  bread.style.translate=holding?`${(Math.random()-.5)*heat/12}px ${(Math.random()-.5)*heat/12}px`:'';
  if(left<=0){left=0;render();return end(false);}
  render();
  raf=requestAnimationFrame(loop);
}
function down(){
  if(state!=='play'||locked||holding)return;
  holding=true;beep(220,.08,'sawtooth',.04);
}
function up(){ if(holding)release(); }
function judge(v){
  if(v>=zoneL&&v<=zoneL+zoneW)return 'perfect';
  if(v>=zoneL-14&&v<=zoneL+zoneW+10&&v<100)return 'good';
  return v<zoneL?'raw':'burnt';
}
function release(){
  if(state!=='play'||!holding)return;
  holding=false;
  const v=heat;
  if(v<8){resetGauge();return;} // 触っただけは無効
  updateZone();
  const k=judge(v);
  let pt=k==='perfect'?2:k==='good'?1:0;
  if(cards.forgive&&pt===0)pt=1;
  $('gauge').classList.remove('inzone');bread.style.translate='';
  if(side===0){ // 表面が終わった → 裏返す
    side=1;pts=pt;sideKinds=[k];setPips();
    locked=true;resetGauge();
    bread.classList.remove('pop','flip');void bread.offsetWidth;bread.classList.add('flip');
    beep(300,.12,'square',.05,200);
    if(k==='perfect'){beep(880,.15,'triangle',.08);burst(4,['✨']);}
    else if(k==='good')beep(620,.12,'triangle',.07);
    else beep(170,.15,'sawtooth',.05,-40);
    setTimeout(()=>{if(state==='play'&&side===1){setZone();locked=false;}},280);
    return;
  }
  finalize(pt,k);
}
function finalize(pt,k){
  sideKinds.push(k);setPips();
  const total=pts+pt;
  const oldRef=refIdx(size),oldBand=bandOf(size);
  let m=MULT[total];
  if(total>=3&&cards.crit)m*=Math.pow(1.15,cards.crit);
  if(total===4){chain++;perfects++;if(chain>=(cards.butter?2:3))m*=1.15;maxChain=Math.max(maxChain,chain);}
  else chain=0;
  size*=m;count++;
  const anyBurnt=sideKinds.includes('burnt');
  const msgs=[anyBurnt?'焦げた…':'生焼け…','ムラあり…','いい焼き色','ほぼ完璧！','会心の焼き上がり！！'];
  const cols=['#bbb','#ffd6d6','#fff','#fff','#ffe066'];
  say(msgs[total]+(total===4&&chain>=3?` ×${chain}連`:''),cols[total]);
  bread.classList.remove('pop','flip');void bread.offsetWidth;bread.classList.add('pop');
  if(total===4){
    app.classList.remove('shake','shake2');void app.offsetWidth;app.classList.add(chain>=3?'shake2':'shake');
    fx('flash');
    const r=$('rumble');r.style.left=(Math.random()<.5?'6%':'46%');r.style.fontSize=(44+Math.min(chain,6)*5)+'px';fx('rumble');
    burst(10+Math.min(chain,5)*3,['✨','⭐','🔥','🥖']);
    beep(660,.25,'triangle',.1,440);beep(990,.2,'sine',.06,300);
    if(navigator.vibrate)navigator.vibrate(chain>=3?[40,30,80]:[30]);
  }else if(total>=2){burst(5,['✨']);beep(520,.15,'triangle',.08);if(navigator.vibrate)navigator.vibrate(15);}
  else beep(150,.25,'sawtooth',.06,-60);

  const newRef=refIdx(size),newBand=bandOf(size);
  if(size>=EARTH){render();return end(true);}
  if(newRef>oldRef){
    let txt=`${REFS[newRef][1]}サイズ突破！`;
    if(newBand!==oldBand)txt+=`\n新ステージ：${STAGES[newBand].n}（難しさアップ）`;
    $('mile').textContent=txt;fx('mile');
    burst(14,['🎉','✨','🍞']);beep(880,.35,'triangle',.1,880);
    if(CARD_AT.includes(newRef)){cardPending=true;setTimeout(showCards,900);}
  }
  locked=true;
  setTimeout(()=>{
    resetBake();resetGauge();
    if(!cardPending&&state==='play'){setZone();locked=false;}
  },340);
}

// ---- 強化カード ----
function showCards(){
  if(state!=='play')return;
  state='card';holding=false;cancelAnimationFrame(raf);resetGauge();
  const pool=CARDS.filter(c=>cards[c.id]<c.max).sort(()=>Math.random()-.5).slice(0,3);
  const box=$('cardlist');box.innerHTML='';
  pool.forEach(c=>{
    const b=document.createElement('button');b.className='cardbtn';
    const lv=cards[c.id]?`（現在 ${cards[c.id]} 枚）`:'';
    b.innerHTML=`<span class="ce">${c.e}</span><span>${c.t}${lv}<small>${c.d}</small></span>`;
    b.addEventListener('click',()=>pickCard(c));
    box.appendChild(b);
  });
  $('cardscr').classList.remove('hide');
  beep(700,.2,'triangle',.08,300);
}
function pickCard(c){
  if(state!=='card')return;
  cards[c.id]++;
  if(c.id==='time')left+=10;
  $('cardscr').classList.add('hide');
  state='play';cardPending=false;lastT=performance.now();
  resetBake();resetGauge();setZone();locked=false;render();
  beep(990,.2,'sine',.08,200);
  raf=requestAnimationFrame(loop);
}

// ---- 一時停止 ----
function pause(){
  if(state!=='play')return;
  state='paused';holding=false;cancelAnimationFrame(raf);stopBgm();
  resetGauge();resetBake(); // 途中の一振りは破棄
  $('pausescr').classList.remove('hide');
}
function resume(){
  if(state!=='paused')return;
  state='play';locked=false;lastT=performance.now();
  if(!cardPending)setZone();
  $('pausescr').classList.add('hide');startBgm();
  raf=requestAnimationFrame(loop);
}
function toTitle(){
  state='title';holding=false;cancelAnimationFrame(raf);stopBgm();
  size=START;count=0;chain=0;left=TIME;locked=false;cardPending=false;cards=newCards();
  resetGauge();resetBake();setZone();render();showBest();
  ['pausescr','over','cardscr'].forEach(id=>$(id).classList.add('hide'));$('title').classList.remove('hide');
}

function end(clear){
  state='over';holding=false;stopBgm();resetGauge();
  if(clear)[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.3,'triangle',.1),i*140));
  const newBest=size>rec.best;
  if(newBest)rec.best=size;
  if(clear){rec.clear++;if(!rec.fast||count<rec.fast)rec.fast=count;}
  localStorage.setItem('panRec',JSON.stringify(rec));
  const got=CARDS.filter(c=>cards[c.id]).map(c=>c.e+'×'+cards[c.id]).join(' ')||'なし';
  $('overIcon').textContent=clear?'🌍🍞':'⏰';
  $('overTitle').textContent=clear?'THE END ― 地球サイズのパン完成！':'TIME UP!';
  $('overStats').innerHTML=
    `<div>最終サイズ<span>${fmt(size)}</span></div>`+
    `<div>到達したパン<span>${STAGES[bandOf(size)].e} ${STAGES[bandOf(size)].n}</span></div>`+
    `<div>焼いた回数<span>${count}</span></div>`+
    `<div>会心の焼き上がり<span>${perfects}</span></div>`+
    `<div>最大連続会心<span>${maxChain}</span></div>`+
    `<div>取った強化<span>${got}</span></div>`+
    `<div>自己ベスト<span>${fmt(rec.best)}${newBest?' NEW!':''}</span></div>`+
    (rec.fast?`<div>最短クリア<span>${rec.fast} 回</span></div>`:'');
  $('over').classList.remove('hide');
  $('over').dataset.text=clear
    ?`まじデカすぎてパン：${count}回で地球サイズのパンを焼いた！🌍🍞（会心${perfects}回）`
    :`まじデカすぎてパン：${REFS[refIdx(size)][1]}級（${fmt(size)}）のパンを焼いた！🍞（会心${perfects}回）あと ×${Math.round(EARTH/size).toLocaleString('ja-JP')} で地球`;
}

// ---- events ----
// タッチ・マウス共通（pointercancel では離さない：長押しでOSが割り込んでも加熱を続ける）
const onScreen=e=>!!e.target.closest('.screen,#pause');
app.addEventListener('pointerdown',e=>{if(onScreen(e))return;e.preventDefault();down();});
window.addEventListener('pointerup',up);
// iOS/Android の長押しメニュー・選択・スクロールを止める
app.addEventListener('touchstart',e=>{if(onScreen(e))return;e.preventDefault();down();},{passive:false});
window.addEventListener('touchend',up);
window.addEventListener('blur',up);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.repeat){e.preventDefault();down();}
  if(e.code==='Escape'||e.code==='KeyP'){state==='play'?pause():resume();}
});
window.addEventListener('keyup',e=>{if(e.code==='Space')up();});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
$('start').addEventListener('click',startGame);
$('retry').addEventListener('click',startGame);
$('pause').addEventListener('click',pause);
$('resume').addEventListener('click',resume);
$('restart').addEventListener('click',startGame);
$('totitle').addEventListener('click',toTitle);
document.querySelectorAll('.bgmbtn').forEach(b=>b.addEventListener('click',toggleBgm));
$('reset').addEventListener('click',()=>{
  if(confirm('記録がすべて消えます。よろしいですか？')){rec={best:0,clear:0,fast:0};localStorage.removeItem('panRec');showBest();}
});
$('share').addEventListener('click',async()=>{
  const text=$('over').dataset.text;
  try{
    if(navigator.share){await navigator.share({text});}
    else{await navigator.clipboard.writeText(text);$('share').textContent='コピーしました';setTimeout(()=>$('share').textContent='結果をシェア',1500);}
  }catch(e){}
});
function showBest(){$('bestline').textContent=rec.best?`自己ベスト：${fmt(rec.best)}`+(rec.fast?` ／ 最短クリア：${rec.fast}回`:''):'';}
bgmLabel();showBest();setZone();setPips();render();
})();
</script>
